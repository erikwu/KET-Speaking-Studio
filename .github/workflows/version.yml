name: Version policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require a version bump for application changes
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:version -- "$BASE_REVISION"
